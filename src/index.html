<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Noble Wave | Your Trusted IT Development Partner</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Noble Wave builds custom software, web and mobile apps, and cloud solutions for businesses from New Delhi, India."
    />
    <meta name="theme-color" content="#0e7490" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Noble Wave",
        "url": "https://noble-wave.com",
        "logo": "https://noble-wave.com/images/logo.svg",
        "description": "Noble Wave designs and builds custom software, web and mobile apps, and cloud solutions.",
        "address": { "@type": "PostalAddress", "addressLocality": "New Delhi", "addressCountry": "IN" },
        "contactPoint": { "@type": "ContactPoint", "telephone": "+918448462846", "email": "info@noble-wave.com", "contactType": "customer support" }
      }
    </script>
    <!-- Resolve the theme before first paint so there is no light/dark flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nw-theme');
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
